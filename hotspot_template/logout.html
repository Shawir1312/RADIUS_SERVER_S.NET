<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.NET Hotspot Logout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="glass-card" style="padding: 40px 30px;">
            <div style="font-size: 3rem; margin-bottom: 20px;">👋</div>
            <h1 class="title">Telah Terputus</h1>
            <p class="subtitle" style="margin-bottom: 15px;">Anda telah berhasil keluar dari jaringan hotspot.</p>
            
            <div class="info-note" style="margin-bottom: 30px; margin-top:0;">
                Koneksi internet Anda saat ini ditangguhkan sementara. Ingat, waktu paket akan terus berjalan meskipun Anda sedang logout.
            </div>

            <a href="$(link-login)" style="text-decoration: none;">
                <button type="button" class="btn">Login Kembali</button>
            </a>
        </div>
    </div>
</body>
</html>
